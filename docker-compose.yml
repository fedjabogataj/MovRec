services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: movrec
      POSTGRES_PASSWORD: movrec
      POSTGRES_DB: movrec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://movrec:movrec@db:5432/movrec
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}

volumes:
  pgdata:
