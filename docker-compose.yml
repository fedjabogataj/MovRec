services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: movrec
      POSTGRES_PASSWORD: movrec
      POSTGRES_DB: movrec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

volumes:
  pgdata:
